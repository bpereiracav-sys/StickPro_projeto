<div style="font-family: Arial, sans-serif; background:#f8fafc; padding:32px;">
  <div style="max-width:620px; margin:0 auto; background:#ffffff; border-radius:28px; overflow:hidden; border:1px solid #e2e8f0; box-shadow:0 20px 50px rgba(15,23,42,.12);">
    
    <div style="background:linear-gradient(135deg,#ef4444,#991b1b); padding:30px 28px; color:white;">
      <div style="font-size:42px;">❌</div>
      <h1 style="margin:10px 0 0; font-size:28px;">
        Evento cancelado
      </h1>
      <p style="margin:8px 0 0; opacity:.92;">
        {{ club_name }}
      </p>
    </div>

    <div style="padding:30px;">
      <h2 style="margin:0; color:#0f172a; font-size:23px;">
        {{ event_title }}
      </h2>

      <p style="margin:18px 0 0; color:#475569; font-size:15px; line-height:1.6;">
        Este evento foi cancelado.
      </p>

      <p style="margin:12px 0 0; color:#475569; font-size:15px; line-height:1.6;">
        <strong>Data original:</strong> {{ original_date }}
      </p>

      <p style="margin:10px 0 0; color:#475569; font-size:15px; line-height:1.6;">
        <strong>Local:</strong> {{ location }}
      </p>

      <p style="margin:22px 0 0; color:#475569; font-size:15px; line-height:1.6;">
        Consulta a aplicação StickPro para veres todos os detalhes atualizados.
      </p>
    </div>

    <div style="padding:18px 28px; background:#f8fafc; text-align:center; color:#94a3b8; font-size:12px;">
      Mensagem enviada automaticamente pela StickPro.
    </div>
  </div>
</div>
